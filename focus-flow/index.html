<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Flow</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var saved = localStorage.getItem("focusFlow.theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Focus Flow</h1>
        <p class="streak" id="streak">🔥 0 day streak</p>
      </div>
      <button id="themeToggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </header>

    <section class="timer-card">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="focus">Focus</button>
        <button class="mode-btn" data-mode="short">Short Break</button>
        <button class="mode-btn" data-mode="long">Long Break</button>
      </div>

      <div class="timer-display" id="timerDisplay">25:00</div>

      <div class="active-task" id="activeTaskLabel">No task selected</div>

      <div class="timer-controls">
        <button id="startBtn" class="btn primary">Start</button>
        <button id="pauseBtn" class="btn" disabled>Pause</button>
        <button id="resetBtn" class="btn">Reset</button>
      </div>

      <div class="settings-row">
        <label>Focus <input type="number" id="focusLen" min="1" max="90" value="25"> min</label>
        <label>Short <input type="number" id="shortLen" min="1" max="30" value="5"> min</label>
        <label>Long <input type="number" id="longLen" min="1" max="60" value="15"> min</label>
      </div>
    </section>

    <section class="tasks-card">
      <h2>Tasks</h2>
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="What are you working on?" autocomplete="off">
        <button type="submit" class="btn primary">Add</button>
      </form>
      <ul id="taskList" class="task-list"></ul>
    </section>

    <section class="log-card">
      <h2>Today's Sessions <span id="sessionCount">(0)</span></h2>
      <ul id="sessionLog" class="session-log"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
